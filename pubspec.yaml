name: sms_send_gmail
description: "Android-only personal app that forwards incoming SMS to Gmail via direct SMTP."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Material 3 icons
  cupertino_icons: ^1.0.8

  # --- SMS reception (incl. background message handler) ---
  # Fork of the `telephony` package, kept up to date for modern Flutter/Android.
  another_telephony: ^0.4.0

  # --- Call detection + call log (forward incoming/missed calls) ---
  # phone_state: near-real-time call state (ringing/answered/ended).
  phone_state: ^2.0.1
  # call_log: read device call history (number, type, duration, timestamp).
  call_log: ^5.0.1

  # --- Foreground service so OEMs don't kill the process ---
  flutter_foreground_task: ^8.17.0

  # --- Direct SMTP email sending (no backend) ---
  mailer: ^6.4.1

  # --- Connectivity for retry logic ---
  connectivity_plus: ^6.1.0

  # --- Local credential + log storage ---
  shared_preferences: ^2.3.2

  # --- Runtime permission requests + battery-optimization helpers ---
  permission_handler: ^11.3.1

  # --- Date formatting ---
  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
